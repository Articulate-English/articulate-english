<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#060a14">
<title>B2 First Speaking — Articulate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cs-accent:#fbbf24;--cs-bg:#060a14;--cs-text:#f2f0f8;--cs-bg-card:#10131f;
  --cs-border:#3d3a2e;--cs-text-muted:#b0bec5;--cs-green:#34d399;
  --cs-accent-glow:rgba(251,191,36,.22);--cs-accent-dim:rgba(251,191,36,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cs-bg);color:var(--cs-text);line-height:1.6;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Montserrat',sans-serif}
/* ═══ DOTFIELD BACKGROUND (React Bits DotField, vanilla port) ═══ */
#dotfield{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#dotfield canvas{position:absolute;inset:0;width:100%;height:100%}
#dotfield svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glass{background:color-mix(in srgb,color-mix(in srgb,var(--cs-bg) 68%,var(--cs-accent) 32%) 55%,transparent);border:1px solid var(--cs-accent-glow);border-radius:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 25px var(--cs-accent-glow),0 0 60px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04)}
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,color-mix(in srgb,var(--cs-bg) 62%,var(--cs-accent) 38%) 85%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--cs-accent-glow);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Montserrat',sans-serif;font-size:1.05rem;font-weight:700;color:#fff;text-decoration:none;letter-spacing:1px}
.nav-logo span{color:var(--cs-accent)}
.theme-cycle-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--cs-accent-glow);background:var(--cs-accent-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--cs-accent);transition:transform .15s ease}
.theme-cycle-btn:hover{transform:scale(1.1);background:rgba(255,255,255,.08)}
.theme-cycle-btn:active{transform:scale(.93)}
.theme-cycle-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--cs-accent-glow))}
.hero{padding:48px 24px 32px;text-align:center;max-width:760px;margin:0 auto}
.hero h1{font-size:2.6rem;margin-bottom:12px;background:linear-gradient(135deg,var(--cs-accent),#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 14px var(--cs-accent-glow)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.hero p{color:var(--cs-text-muted);font-size:1rem;max-width:560px;margin:0 auto;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.section{max-width:1000px;margin:0 auto;padding:0 24px 56px}
.section-title{font-family:'Montserrat',sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--cs-text-muted);margin-bottom:18px}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.deck-card{position:relative;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .3s ease,border-color .3s ease}
.deck-card .card-img{width:100%;height:160px;object-fit:cover;display:block}
.deck-card .card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.deck-card:hover{transform:scale(1.03);border-color:var(--cs-accent);box-shadow:0 12px 40px var(--cs-accent-glow)}
.deck-card:active{transform:scale(.97)}
.deck-card .badge{position:absolute;top:12px;right:12px;z-index:2;display:none;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--cs-green);color:#04120b;box-shadow:0 0 14px rgba(52,211,153,.5)}
.deck-card .badge.done{display:inline-block}
.deck-card .num{font-size:.7rem;font-weight:700;color:var(--cs-accent);text-transform:uppercase;letter-spacing:1px}
.deck-card h3{font-size:1.15rem;font-weight:700}
.deck-card p{font-size:.82rem;color:var(--cs-text-muted);line-height:1.5}
.footer{position:relative;z-index:1;text-align:center;padding:30px 24px;font-size:.75rem;color:var(--cs-text-muted);border-top:1px solid var(--cs-border)}
@media(max-width:640px){.hero h1{font-size:1.8rem}.deck-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="dotfield" aria-hidden="true"></div>
<nav class="nav">
  <a href="../index.html" class="nav-logo"><span>Articulate</span> B2 First</a>
  <button class="theme-cycle-btn" id="themeCycleBtn" title="Cycle theme" aria-label="Cycle color theme">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  </button>
</nav>

<header class="hero">
  <h1>B2 First Speaking</h1>
  <p>12 topic-based practice decks covering Part 1 interview, Part 2 photo comparison, Part 3 collaborative task, and reading/listening/writing homework.</p>
</header>

<section class="section">
  <div class="section-title">Choose a topic</div>
  <div class="deck-grid" id="deckGrid"></div>
</section>

<footer class="footer">
  <p>Original FCE-style practice content for B2 learners.</p>
  <a href="../index.html" style="color:var(--cs-accent)">Back to Articulate</a>
</footer>

<script>
var DECKS=[
  {id:'01-health-fitness',title:'Health & Fitness',desc:'Exercise, diet, sleep, and wellbeing.',img:'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=940&q=80'},
  {id:'02-education-school',title:'Education & School Life',desc:'Subjects, exams, teachers, and future study.',img:'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=940&q=80'},
  {id:'03-friends-family',title:'Friends & Family',desc:'Relationships, siblings, and social life.',img:'https://images.unsplash.com/photo-1511895426328-dc8714191300?w=940&q=80'},
  {id:'04-food-cooking',title:'Food & Cooking',desc:'Meals, cuisines, eating habits, and restaurants.',img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=940&q=80'},
  {id:'05-shopping-money',title:'Shopping & Money',desc:'Buying habits, budgets, and saving.',img:'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=940&q=80'},
  {id:'06-work-future',title:'Work & Future Plans',desc:'Jobs, careers, university, and ambitions.',img:'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=940&q=80'},
  {id:'07-music-concerts',title:'Music & Concerts',desc:'Genres, live music, and listening habits.',img:'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=940&q=80'},
  {id:'08-sports-games',title:'Sports & Games',desc:'Team sports, fitness, and competitions.',img:'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=940&q=80'},
  {id:'09-books-reading',title:'Books & Reading',desc:'Reading habits, genres, and libraries.',img:'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=940&q=80'},
  {id:'10-films-tv',title:'Films & TV Shows',desc:'Cinema, streaming, and favourite series.',img:'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=940&q=80'},
  {id:'11-transport',title:'Transport & Getting Around',desc:'Public transport, cars, cycling, and travel.',img:'https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=940&q=80'},
  {id:'12-internet-ai',title:'The Internet & AI',desc:'Social media, artificial intelligence, and privacy.',img:'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=940&q=80'}
];

var THEME_ORDER=['classic','forest','violet','gold','rose','ocean','indigo'];
var THEMES={
  classic:{accent:'#fbbf24',bg:'#191207',text:'#f2f0f8',card:'#191207',border:'#4a3a1e'},
  forest:{accent:'#34d399',bg:'#081710',text:'#f2f0f8',card:'#081710',border:'#1f4a3a'},
  violet:{accent:'#a78bfa',bg:'#120e22',text:'#f2f0f8',card:'#120e22',border:'#3b3563'},
  gold:{accent:'#f59e0b',bg:'#1a1206',text:'#f2f0f8',card:'#1a1206',border:'#4a3a1e'},
  rose:{accent:'#fb7185',bg:'#1e0d13',text:'#f2f0f8',card:'#1e0d13',border:'#5a2a38'},
  ocean:{accent:'#22d3ee',bg:'#061620',text:'#f2f0f8',card:'#061620',border:'#1f4a5a'},
  indigo:{accent:'#818cf8',bg:'#0a0a24',text:'#eef0ff',card:'#0a0a24',border:'#2e2e5e'}
};
var themeIcons={
  1:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  2:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  3:'<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>',
  4:'<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
  5:'<path d="M12 18.176a3 3 0 1 1 -4.953 -2.449l-.025 .023a4.502 4.502 0 0 1 1.483 -8.75c1.414 0 2.675 .652 3.5 1.671a4.5 4.5 0 1 1 4.983 7.079a3 3 0 1 1 -4.983 2.25l-.005 .176"/><path d="M12 19v-10"/><path d="M9 3l3 2l3 -2"/>',
  6:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  7:'<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/><path d="M18 5h4"/><path d="M20 3v4"/>'
};
function applyTheme(name){
  var t=THEMES[name]; if(!t) return;
  var r=document.documentElement;
  r.style.setProperty('--cs-accent',t.accent);
  r.style.setProperty('--cs-bg',t.bg);
  r.style.setProperty('--cs-text',t.text);
  r.style.setProperty('--cs-bg-card',t.card);
  r.style.setProperty('--cs-border',t.border);
  r.style.setProperty('--cs-text-muted',t.text+'99');
  r.style.setProperty('--cs-accent-glow',t.accent+'38');
  r.style.setProperty('--cs-accent-dim',t.accent+'1a');
  var icon=document.getElementById('themeIcon');
  var ti=THEME_ORDER.indexOf(name)+1;
  if(icon && themeIcons[ti]) icon.innerHTML=themeIcons[ti];
  if(window.fceSetDotColors) window.fceSetDotColors(t.accent);
  try{localStorage.setItem('fce-theme',name);}catch(e){}
}
document.getElementById('themeCycleBtn').addEventListener('click',function(){
  var saved=localStorage.getItem('fce-theme')||'classic';
  var idx=THEME_ORDER.indexOf(saved);
  if(idx<0) idx=0;
  applyTheme(THEME_ORDER[(idx+1)%THEME_ORDER.length]);
});
applyTheme(localStorage.getItem('fce-theme')||'classic');

var progress={};
try{progress=JSON.parse(localStorage.getItem('fce-progress')||'{}');}catch(e){}

var grid=document.getElementById('deckGrid');
DECKS.forEach(function(d){
  var completed=!!progress[d.id];
  var a=document.createElement('a');
  a.className='deck-card glass';
  a.href='decks/'+d.id+'.html';
  a.innerHTML=''+
    '<img class="card-img" src="'+d.img+'" alt="">'+
    '<div class="card-body">'+
      '<span class="badge '+(completed?'done':'')+'">'+(completed?'DONE':'')+'</span>'+
      '<span class="num">#'+d.id.split('-')[0]+'</span>'+
      '<h3>'+d.title+'</h3>'+
      '<p>'+d.desc+'</p>'+
    '</div>';
  grid.appendChild(a);
});

// ═══ DOTFIELD BACKGROUND (React Bits DotField -> vanilla JS, theme-reactive) ═══
(function(){
  var ctn = document.getElementById('dotfield');
  if (!ctn) return;
  function hexToRgba(hex, a){
    var h = (hex || '#22d3ee').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  var TWO_PI = Math.PI * 2;
  var dotRadius = 6, dotSpacing = 28, cursorRadius = 1000, cursorForce = 0.1;
  var bulgeOnly = true, bulgeStrength = 67, glowRadius = 320, sparkle = false, waveAmplitude = 0;
  var acc = getComputedStyle(document.documentElement).getPropertyValue('--cs-accent').trim();
  var gradientFrom = hexToRgba(acc, .6);
  var gradientTo = hexToRgba(acc, .35);
  var glowColor = '#0d1220';

  window.fceSetDotColors = function(accent){
    gradientFrom = hexToRgba(accent, .6);
    gradientTo = hexToRgba(accent, .35);
  };

  var canvas = document.createElement('canvas');
  ctn.appendChild(canvas);
  var ctx = canvas.getContext('2d', { alpha: true });
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  var gid = 'dotfield-glow-' + Math.random().toString(36).slice(2, 9);
  var rg = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
  rg.setAttribute('id', gid);
  var stop0 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
  stop0.setAttribute('offset', '0%'); stop0.setAttribute('stop-color', glowColor);
  var stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
  stop1.setAttribute('offset', '100%'); stop1.setAttribute('stop-color', 'transparent');
  rg.appendChild(stop0); rg.appendChild(stop1); defs.appendChild(rg); svg.appendChild(defs);
  var glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  glow.setAttribute('cx', '-9999'); glow.setAttribute('cy', '-9999');
  glow.setAttribute('r', glowRadius); glow.setAttribute('fill', 'url(#' + gid + ')');
  glow.style.opacity = '0'; glow.style.willChange = 'opacity';
  svg.appendChild(glow); ctn.appendChild(svg);

  var dots = [];
  var mouse = { x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 };
  var size = { w: 0, h: 0 };
  var glowOpacity = 0, engagement = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function buildDots(w, h){
    var step = dotRadius + dotSpacing;
    var cols = Math.floor(w / step), rows = Math.floor(h / step);
    var padX = (w % step) / 2, padY = (h % step) / 2;
    var arr = new Array(rows * cols), idx = 0;
    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var ax = padX + col * step + step / 2;
        var ay = padY + row * step + step / 2;
        arr[idx++] = { ax: ax, ay: ay, sx: ax, sy: ay, vx: 0, vy: 0, x: ax, y: ay };
      }
    }
    dots = arr;
  }

  function doResize(){
    var rect = ctn.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size.w = w; size.h = h;
    buildDots(w, h);
  }
  var resizeTimer = null;
  function onResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(doResize, 100); }
  doResize();
  window.addEventListener('resize', onResize);

  function onMouseMove(e){
    mouse.x = e.clientX; mouse.y = e.clientY;
  }
  window.addEventListener('mousemove', onMouseMove, { passive: true });

  function updateMouseSpeed(){
    var dx = mouse.prevX - mouse.x, dy = mouse.prevY - mouse.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    mouse.speed += (dist - mouse.speed) * 0.5;
    if (mouse.speed < 0.001) mouse.speed = 0;
    mouse.prevX = mouse.x; mouse.prevY = mouse.y;
  }
  var speedInterval = setInterval(updateMouseSpeed, 20);

  var frameCount = 0;

  function tick(){
    frameCount++;
    var len = dots.length;
    var t = frameCount * 0.02;
    var targetEng = Math.min(mouse.speed / 5, 1);
    engagement += (targetEng - engagement) * 0.06;
    if (engagement < 0.001) engagement = 0;
    var eng = engagement;
    glowOpacity += (eng - glowOpacity) * 0.08;

    glow.setAttribute('cx', mouse.x);
    glow.setAttribute('cy', mouse.y);
    glow.style.opacity = glowOpacity;

    ctx.clearRect(0, 0, size.w, size.h);
    var grad = ctx.createLinearGradient(0, 0, size.w, size.h);
    grad.addColorStop(0, gradientFrom);
    grad.addColorStop(1, gradientTo);
    ctx.fillStyle = grad;

    var cr = cursorRadius, crSq = cr * cr, rad = dotRadius / 2;
    ctx.beginPath();

    for (var i = 0; i < len; i++) {
      var d = dots[i];
      var dx = mouse.x - d.ax, dy = mouse.y - d.ay;
      var distSq = dx * dx + dy * dy;

      if (distSq < crSq && eng > 0.01) {
        var dist = Math.sqrt(distSq);
        if (bulgeOnly) {
          var bt = 1 - dist / cr;
          var push = bt * bt * bulgeStrength * eng;
          var angle = Math.atan2(dy, dx);
          d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
          d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
        } else {
          var angle2 = Math.atan2(dy, dx);
          var move = (500 / dist) * (mouse.speed * cursorForce);
          d.vx += Math.cos(angle2) * -move;
          d.vy += Math.sin(angle2) * -move;
        }
      } else if (bulgeOnly) {
        d.sx += (d.ax - d.sx) * 0.1;
        d.sy += (d.ay - d.sy) * 0.1;
      }

      if (!bulgeOnly) {
        d.vx *= 0.9; d.vy *= 0.9;
        d.x = d.ax + d.vx; d.y = d.ay + d.vy;
        d.sx += (d.x - d.sx) * 0.1;
        d.sy += (d.y - d.sy) * 0.1;
      }

      var drawX = d.sx, drawY = d.sy;
      if (waveAmplitude > 0) {
        drawY += Math.sin(d.ax * 0.03 + t) * waveAmplitude;
        drawX += Math.cos(d.ay * 0.03 + t * 0.7) * waveAmplitude * 0.5;
      }

      if (sparkle) {
        var hash = ((i * 2654435761) ^ (frameCount >> 3)) >>> 0;
        if ((hash % 100) < 3) {
          ctx.moveTo(drawX + rad * 1.8, drawY);
          ctx.arc(drawX, drawY, rad * 1.8, 0, TWO_PI);
        } else {
          ctx.moveTo(drawX + rad, drawY);
          ctx.arc(drawX, drawY, rad, 0, TWO_PI);
        }
      } else {
        ctx.moveTo(drawX + rad, drawY);
        ctx.arc(drawX, drawY, rad, 0, TWO_PI);
      }
    }

    ctx.fill();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
